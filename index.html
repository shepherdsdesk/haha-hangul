<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#B26B35">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>하하 한글</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 따뜻한 교습소, 아이에게 친절하게
   IDEA: 원목 현판 — 갈색 나무판에 흰 선 테두리
   PICTURE: 큰 글자 카드가 화면의 주인공
   COLOUR/TYPE: 원목 갈색·크림, 학습엔 분홍·청록·노랑 / Jua 로고, Noto Sans KR 학습
   LAYOUT: 태블릿 가로 화면 한 장, 스크롤 없음 */
:root{--wood:#B26B35;--wood-d:#8A4F22;--wood-l:#F3E3D0;--cream:#FBF5EC;--ink:#3E2A1C;--muted:#8C7563;--line:#EADCC8;
--pink:#E9557F;--pink-l:#FDE7EF;--teal:#1E9DA3;--teal-l:#E0F4F4;--yellow:#F4BE34;--yellow-l:#FFF3D4;--green:#3A9F63;--green-l:#E5F5EA;--red:#D9483B;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0;min-width:0;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(13px,1.5vh + .55vw,22px)}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:#FCEEDC;color:var(--ink);height:100vh;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;white-space:nowrap;line-height:1.2}
button:disabled{opacity:.4;cursor:default}
input,select{border:2px solid var(--line);border-radius:.7rem;padding:.55rem .8rem;background:#fff;font-size:1rem;min-height:2.8rem;user-select:text;-webkit-user-select:text}
input:focus,select:focus{outline:3px solid var(--teal-l);border-color:var(--teal)}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
svg.i{width:1.3em;height:1.3em;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;height:3.6rem;padding:0 1.6rem;border-radius:1.8rem;background:#fff;border:2px solid var(--line);font-weight:700;font-size:1.15rem;color:var(--ink)}
.btn.primary{background:var(--wood);border-color:var(--wood);color:#fff}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.sm{height:2.6rem;padding:0 1rem;font-size:.95rem;border-radius:1.3rem}
.btn:active{transform:scale(.97)}
.row{display:flex;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap}
.hint{font-size:1.25rem;font-weight:700;color:var(--muted);text-align:center}
/* 현판 */
.wood{background:repeating-linear-gradient(98deg,rgba(255,255,255,.05) 0 2px,transparent 2px 13px),repeating-linear-gradient(94deg,rgba(0,0,0,.035) 0 1px,transparent 1px 23px),linear-gradient(135deg,#C07B45,#A9642F)}
.sign{border-radius:2rem;padding:1.1rem;width:min(56vh,70vw);aspect-ratio:1}
.sign-in{height:100%;border:3px solid rgba(255,255,255,.92);border-radius:1.35rem;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:.6rem}
.sign svg.logo{width:28%;height:auto;stroke:#fff}
.logo-t{font-family:'Jua',sans-serif;font-size:min(9vh,4.4rem);letter-spacing:.06em;line-height:1.1;white-space:nowrap}
.logo-s{font-size:min(2.6vh,1.25rem);letter-spacing:.35em;font-weight:500;white-space:nowrap;margin-right:-.35em}
#intro{align-items:center;justify-content:center;gap:2rem;padding-bottom:5vh}
#intro .start{height:4.4rem;padding:0 3.4rem;font-size:1.5rem;border-radius:2.2rem}
/* 상단 바 */
.bar{display:flex;align-items:center;gap:1rem;padding:1rem 1.6rem;flex:none}
.mini{display:flex;align-items:center;gap:.6rem;font-family:'Jua';font-size:1.6rem;color:var(--wood-d);white-space:nowrap}
.mini .chip{width:2.6rem;height:2.6rem;border-radius:.7rem;display:grid;place-items:center;padding:.25rem}
.mini .chip>div{width:100%;height:100%;border:1.5px solid rgba(255,255,255,.9);border-radius:.45rem;display:grid;place-items:center}
.mini .chip svg{width:78%;stroke:#fff}
.bar h1{flex:1;text-align:center;font-size:1.7rem;font-weight:900;white-space:nowrap}
.bar .side{width:12rem;display:flex;justify-content:flex-end;color:var(--muted);font-weight:500;white-space:nowrap}
/* 반 탭 */
.tabs{display:flex;justify-content:center;gap:.7rem;padding:0 1.6rem .9rem;flex:none}
.tab{height:3.2rem;padding:0 1.6rem;border-radius:1.6rem;font-weight:700;font-size:1.15rem;background:#fff;border:2px solid var(--line);color:var(--muted)}
.tab.on{background:var(--wood);border-color:var(--wood);color:#fff}
.kids{flex:1;overflow-y:auto;padding:.6rem 2rem 2rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:1.1rem;align-content:start}
.kid{position:relative;border-radius:1.4rem;padding:.4rem;background:#fff;border:2px solid var(--line);height:12rem}
.kid .in{height:100%;border-radius:1.05rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem}
.kid .ani{font-size:3.6rem;line-height:1}
.kid .nm{font-size:1.45rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 .4rem}
.kid .lv{font-size:.9rem;color:var(--muted);font-weight:500;white-space:nowrap}
.kid .done{position:absolute;top:.7rem;right:.7rem;background:var(--green);color:#fff;font-size:.8rem;font-weight:700;padding:.2rem .6rem;border-radius:1rem;white-space:nowrap}
.kid:active{transform:scale(.97)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:1.2rem;padding:4rem 0}
.lock{position:fixed;right:1.1rem;bottom:1.1rem;width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;color:#C9B49C;background:transparent}
.lock .ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--wood);opacity:0;transform:scale(.7);transition:none}
.lock.hold .ring{opacity:1;transform:scale(1.15);transition:all 1.2s linear}
/* 학습 */
.lbar{display:flex;align-items:center;gap:1rem;padding:.9rem 1.4rem;flex:none}
.ibtn{width:3.4rem;height:3.4rem;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;color:var(--wood-d);flex:none}
.dots{flex:1;display:flex;justify-content:center;gap:.5rem}
.dot{display:flex;align-items:center;gap:.4rem;height:2.4rem;padding:0 1rem;border-radius:1.2rem;font-size:.95rem;font-weight:700;color:#B9A48E;background:#fff;border:2px solid var(--line);white-space:nowrap}
.dot.on{background:var(--yellow-l);border-color:var(--yellow);color:var(--wood-d)}
.dot.ok{color:var(--green);border-color:#BFE3CC;background:var(--green-l)}
.who{display:flex;align-items:center;gap:.5rem;font-weight:900;font-size:1.2rem;white-space:nowrap;width:9rem;justify-content:flex-end}
.who span{font-size:2rem}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:0 2rem 1.6rem;min-height:0}
.lt{font-size:1rem;color:var(--muted);font-weight:700;white-space:nowrap}
.bigcard{width:min(80vw,62rem);height:42vh;border-radius:2rem;background:#fff;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;padding:1.5rem 2rem;position:relative}
.bigcard .spk{position:absolute;top:1rem;right:1rem;color:var(--teal)}
.g1{font-size:min(30vh,13rem);font-weight:500;line-height:1}
.g2{font-size:min(20vh,9rem);font-weight:500;line-height:1}
.g3{font-size:min(13vh,6rem);font-weight:500;line-height:1.1}
.g4{font-size:min(7.5vh,3.4rem);font-weight:500;line-height:1.35;white-space:normal;text-align:center;word-break:keep-all}
.cnt{font-weight:700;color:var(--muted);font-size:1rem;white-space:nowrap;min-width:4rem;text-align:center}
.qhead{display:flex;align-items:center;gap:1.2rem}
.speaker{width:6rem;height:6rem;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center}
.speaker svg{width:3rem;height:3rem}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2rem;width:min(86vw,64rem)}
.opts.col{grid-template-columns:1fr;width:min(80vw,46rem);gap:.9rem}
.opt{height:28vh;border-radius:1.6rem;background:#fff;border:3px solid var(--line);display:grid;place-items:center;padding:.5rem 1rem}
.opts.col .opt{height:auto;min-height:5rem;padding:.9rem 1.4rem}
.opt.ok{border-color:var(--green);background:var(--green-l);color:var(--green)}
.opt.no{border-color:var(--red);background:#FCE9E6;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.tbox{position:relative;width:min(88vw,66rem);height:42vh;border-radius:1.6rem;background:#fff;border:3px solid var(--line);touch-action:none;overflow:hidden}
.tbox canvas{position:absolute;inset:0;width:100%;height:100%}
.msg{font-size:1.4rem;font-weight:900;height:2rem;white-space:nowrap}
.msg.good{color:var(--green)}.msg.again{color:var(--pink)}
.paper{display:flex;flex-direction:column;align-items:center;gap:1rem}
.paper .num{width:9rem;height:9rem;border-radius:50%;background:var(--yellow-l);border:4px solid var(--yellow);display:grid;place-items:center;font-size:4.5rem;font-weight:900;color:var(--wood-d)}
.answers{display:flex;flex-direction:column;gap:.7rem;width:min(80vw,46rem)}
.answers div{display:flex;align-items:center;gap:1rem;background:#fff;border:2px solid var(--line);border-radius:1.1rem;padding:.8rem 1.3rem;font-size:1.8rem;font-weight:700}
.answers b{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--yellow-l);display:grid;place-items:center;font-size:1.2rem;color:var(--wood-d);flex:none}
.story{width:min(84vw,56rem);background:#fff;border:3px solid var(--line);border-radius:1.8rem;padding:1.6rem 2rem;display:flex;flex-direction:column;gap:.5rem}
.story button{text-align:left;font-size:1.9rem;font-weight:500;padding:.4rem .6rem;border-radius:.8rem;white-space:normal;word-break:keep-all}
.story button:active{background:var(--teal-l)}
.qtext{font-size:1.7rem;font-weight:900;text-align:center;word-break:keep-all}
.recb{width:7rem;height:7rem;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;position:relative}
.recb svg{width:3.2rem;height:3.2rem}
.recb.on{background:var(--red)}
.recb.on::after{content:"";position:absolute;inset:-.6rem;border-radius:50%;border:4px solid var(--pink);animation:pulse 1s infinite}
@keyframes pulse{from{opacity:1;transform:scale(.9)}to{opacity:0;transform:scale(1.25)}}
.speakrow{display:flex;align-items:center;justify-content:center;gap:1.6rem}
.stamp{width:min(34vh,17rem);height:min(34vh,17rem);border-radius:50%;border:.7rem solid var(--pink);color:var(--pink);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);animation:stampin .5s cubic-bezier(.2,1.6,.4,1)}
.stamp b{font-size:min(5.2vh,2.6rem);font-weight:900;white-space:nowrap}
.stamp span{font-family:'Jua';font-size:min(5vh,2.4rem);white-space:nowrap}
@keyframes stampin{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.stampsum{font-size:1.3rem;font-weight:700;color:var(--wood-d);white-space:nowrap}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(#FFF8EC,#FCEEDC 72%);pointer-events:none}
#app{position:relative;z-index:1;height:100%}
.screen{z-index:1}
body.admin #bg{display:none}
.hills{position:absolute;left:0;bottom:0;width:100%;height:24vh}
.sun{position:absolute;top:5vh;right:6vw;width:9vh;height:9vh;border-radius:50%;background:#FFE08A;box-shadow:0 0 0 1.4vh rgba(255,224,138,.35),0 0 0 3vh rgba(255,224,138,.16)}
.cloud{position:absolute;height:4.6vh;width:15vh;background:#fff;border-radius:5vh;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:6.6vh;height:6.6vh;left:2.4vh;top:-3.2vh}.cloud::after{width:4.8vh;height:4.8vh;left:7.6vh;top:-2vh}
@keyframes drift{from{transform:translateX(-30vh)}to{transform:translateX(120vw)}}
.fl{position:absolute;font-weight:900;opacity:.22;animation:bob ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-10deg)}to{transform:translateY(-2.4vh) rotate(10deg)}}
.sign{animation:float 3.6s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-1.2vh) rotate(-1deg)}}
.parade{position:fixed;bottom:3vh;left:0;right:0;display:flex;justify-content:center;gap:5vw;font-size:2.6rem;z-index:2;pointer-events:none}
.parade span{animation:hop 1.1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-1.4rem) rotate(-6deg)}}
.kid .ani{animation:bob2 2.4s ease-in-out infinite}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-.45rem)}}
.path{flex:1;display:flex;justify-content:center}
.track{position:relative;display:flex;justify-content:space-between;width:min(54vw,40rem);padding-top:1.7rem}
.track::before{content:"";position:absolute;left:1.2rem;right:1.2rem;top:2.9rem;border-top:.28rem dashed #E3CDB2}
.stone{position:relative;display:flex;flex-direction:column;align-items:center;gap:.2rem;width:2.4rem}
.stone i{width:2.4rem;height:2.4rem;border-radius:50%;background:#fff;border:3px solid var(--line);display:grid;place-items:center;color:#fff}
.stone i svg{width:1.2rem;height:1.2rem}
.stone.ok i{background:var(--green);border-color:var(--green)}
.stone.on i{background:var(--yellow);border-color:var(--yellow)}
.stone b{font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap}
.stone.on b{color:var(--wood-d)}
.walker{position:absolute;top:-.3rem;font-size:1.9rem;line-height:1;transform:translateX(-50%);transition:left .7s cubic-bezier(.3,1.5,.5,1);animation:bob2 1.4s ease-in-out infinite}
.bigcard::before{content:"";position:absolute;inset:.7rem;border:2px dashed #EFE2D0;border-radius:1.5rem;pointer-events:none}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.opt:nth-child(1){background:var(--pink-l);border-color:#F6C9D7}
.opt:nth-child(2){background:var(--teal-l);border-color:#B7E2E3}
.opt:nth-child(3){background:var(--yellow-l);border-color:#F6DE9C}
.opt.ok{border-color:var(--green)!important;background:var(--green-l)!important;color:var(--green)}
.opt.no{border-color:var(--red)!important;background:#FCE9E6!important}
.cheer{position:fixed;left:50%;top:20vh;display:flex;align-items:center;gap:.6rem;z-index:30;pointer-events:none;animation:cheer 1.2s ease-out forwards}
.cheer span{font-size:3.6rem;line-height:1}
.cheer b{background:#fff;border:3px solid var(--yellow);border-radius:1.4rem;padding:.5rem 1.2rem;font-size:1.6rem;font-weight:900;color:var(--wood-d);white-space:nowrap}
.cheer.sad b{border-color:var(--teal);color:var(--teal)}
@keyframes cheer{0%{opacity:0;transform:translate(-50%,1rem) scale(.6)}18%{opacity:1;transform:translate(-50%,0) scale(1.06)}80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-1.2rem)}}
.cf{position:fixed;width:.7rem;height:1rem;border-radius:2px;pointer-events:none;z-index:40;animation:burst var(--t,.9s) ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.board{display:grid;grid-template-columns:repeat(10,2.5rem);gap:.45rem;background:#fff;border:3px solid var(--line);border-radius:1.2rem;padding:.7rem 1rem}
.board i{width:2.5rem;height:2.5rem;border-radius:50%;border:2px dashed #E3CDB2;display:grid;place-items:center;font-style:normal;font-size:1.05rem;font-weight:900;color:transparent}
.board i.f{border:3px solid var(--pink);color:var(--pink);transform:rotate(-12deg)}
.board i.new{animation:stampin .5s .6s backwards}

/* 아이 홈 */
.who{display:flex;align-items:center;gap:.5rem;font-weight:900;font-size:1.2rem;white-space:nowrap;width:9rem;justify-content:flex-end}
.hgrid{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:1.3rem;padding:.3rem 2.2rem .8rem;min-height:0}
.today{border-radius:2rem;padding:.9rem;display:flex}
.tin{flex:1;border:3px solid rgba(255,255,255,.9);border-radius:1.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;color:#fff}
.tl{font-size:1.3rem;font-weight:700;white-space:nowrap}
.tn{font-family:'Jua';font-size:min(12vh,5rem);line-height:1;white-space:nowrap}
.tt{font-size:1.5rem;font-weight:700;white-space:nowrap}
.tbtn{margin-top:.6rem;background:#fff;color:var(--wood-d);font-weight:900;font-size:1.35rem;height:3.6rem;padding:0 2.4rem;border-radius:1.8rem;display:flex;align-items:center;white-space:nowrap}
.today:active{transform:scale(.98)}
.tiles{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:.9rem}
.tile{display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr 1fr;column-gap:1.1rem;text-align:left;border-radius:1.6rem;padding:0 1.5rem;border:3px solid;background:#fff}
.tile .te{grid-row:1/3;align-self:center;font-size:min(7vh,3.2rem)}
.tile b{font-size:1.45rem;font-weight:900;align-self:end;white-space:nowrap}
.tile em{font-style:normal;color:var(--muted);font-size:1rem;align-self:start;white-space:nowrap;font-weight:500}
.tile:active{transform:scale(.98)}
.t-pink{background:var(--pink-l);border-color:#F6C9D7}.t-teal{background:var(--teal-l);border-color:#B7E2E3}.t-yellow{background:var(--yellow-l);border-color:#F6DE9C}
.hstamp{display:flex;align-items:center;gap:1rem;justify-content:center;padding:0 2rem 1rem;font-weight:700;color:var(--wood-d);white-space:nowrap;flex:none}
.board.sm{grid-template-columns:repeat(10,1.9rem);gap:.35rem;padding:.35rem .7rem;border-width:2px}
.board.sm i{width:1.9rem;height:1.9rem;font-size:.8rem}
/* 한글 길 */
.mapscroll{flex:1;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;min-height:0}
.mapin{position:relative;height:100%}
.village{position:absolute;top:.3rem;bottom:1.2rem;border-radius:2rem;border:3px dashed}
.v0{background:rgba(229,245,234,.8);border-color:#BFE3CC}.v1{background:rgba(253,231,239,.8);border-color:#F6C9D7}.v2{background:rgba(224,244,244,.8);border-color:#B7E2E3}.v3{background:rgba(227,240,251,.85);border-color:#B9D7F0}.v4{background:rgba(255,243,212,.85);border-color:#F6DE9C}
.vt{position:absolute;top:.9rem;left:1.4rem;font-size:1.3rem;font-weight:900;white-space:nowrap;color:var(--wood-d)}
.mpath{position:absolute;left:0;top:0;pointer-events:none}
.st2{position:absolute;width:3.4rem;height:3.4rem;margin:-1.7rem 0 0 -1.7rem;border-radius:50%;background:#fff;border:3px solid var(--line);font-weight:900;font-size:1.05rem;color:var(--muted);display:grid;place-items:center}
.st2.open{color:var(--ink);border-color:#D9C6AE}
.st2.done{background:var(--yellow);border-color:#E3A81B;color:var(--wood-d)}
.st2.cur{background:var(--pink);border-color:var(--pink);color:#fff;width:4.2rem;height:4.2rem;margin:-2.1rem 0 0 -2.1rem;font-size:1.3rem}
.st2.lock{opacity:.5}
.st2 .me{position:absolute;top:-2.9rem;font-size:2.3rem;line-height:1;animation:bob2 1.2s ease-in-out infinite}
.st2 .flag{position:absolute;top:-1.4rem;right:-.9rem;font-size:1.3rem}
.st2 .star{position:absolute;top:-.75rem;right:-.6rem;font-size:1.05rem}
/* 놀이터 */
.pbody{flex:1;min-height:0;display:flex;gap:1.4rem;padding:.1rem 2rem 1.1rem}

const DB={db:null,
open(){return new Promise(res=>{if(this.db)return res(this.db);try{const r=indexedDB.open('hahaHangul',1);r.onupgradeneeded=()=>r.result.createObjectStore('b');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>res(null)}catch(e){res(null)}})},
async put(k,v){const d=await this.open();if(!d)return false;return new Promise(r=>{try{const t=d.transaction('b','readwrite');t.objectStore('b').put(v,k);t.oncomplete=()=>r(true);t.onerror=()=>r(false)}catch(e){r(false)}})},
async get(k){const d=await this.open();if(!d)return null;return new Promise(r=>{try{const q=d.transaction('b').objectStore('b').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})},
async del(k){const d=await this.open();if(!d)return;return new Promise(r=>{try{const t=d.transaction('b','readwrite');t.objectStore('b').delete(k);t.oncomplete=()=>r();t.onerror=()=>r()}catch(e){r()}})}};

/* 학습 만들기 */
function poolFor(n,len,sent){let p=[];for(let i=n;i>=1&&p.length<40;i--){const l=LESSONS[i-1];if(stageOf(i)!==stageOf(n)&&p.length>8)break;p.push(...l.items)}
p=[...new Set(p)].filter(t=>isSent(t)===sent);return p}
function distract(t,n,k){const L0=LESSONS[n-1],sent=isSent(t);let c=L0.items.filter(x=>x!==t&&isSent(x)===sent);
if(c.length<k)c=[...new Set([...c,...poolFor(n,t.length,sent).filter(x=>x!==t)])];
if(c.length<k)c=[...new Set([...c,...['아','어','오','우','으','이','야','여'].filter(x=>x!==t)])];
c=shuffle(c).sort((a,b)=>Math.abs(a.length-t.length)-Math.abs(b.length-t.length));return c.slice(0,k)}
function mkQ(t,n){return{t,o:shuffle([t,...distract(t,n,2)])}}
const buildable=L0=>L0.items.filter(x=>!isSent(x)&&x.length<=2&&[...x].every(ch=>ch>='가'&&ch<='힣'));
const GAMES=['balloon','mole','match','build'];
function mkQuiz(L0,n){const it=shuffle(L0.items);const qs=[];for(let i=0;i<5;i++)qs.push(mkQ(it[i%it.length],n));return qs}
function traceItems(L0,st){let c=L0.items.filter(t=>!isSent(t)&&t.length<=(st===1?2:3));if(st===1){const one=c.filter(t=>t.length===1);if(one.length>=2)c=one}return shuffle(c).slice(0,2)}
function buildSteps(n,P,practice){const st=stageOf(n),L0=LESSONS[n-1],steps=[];
const due=practice?[]:Object.entries(P.review).filter(([,r])=>r.due<=P.sessions).sort((a,b)=>a[1].due-b[1].due).slice(0,3).map(([t])=>t);
if(due.length)steps.push({type:'review',g:'복습',qs:due.map(t=>mkQ(t,Math.max(n,P.review[t].n||1)))});
if(STORIES[n]){steps.push({type:'story',g:'글 읽기',lines:L0.items,qs:STORIES[n].map(q=>({t:q.a,q:q.q,o:shuffle(q.o)}))});steps.push({type:'speak',g:'소리 내 읽기',items:[L0.items.join(' ')]})}
else{steps.push({type:'learn',g:'새 글자',items:L0.items.slice(0,8)});
if(isSent(L0.items[0]))steps.push({type:'quiz',g:'놀이',qs:mkQuiz(L0,n).slice(0,4)});
else{let gs=GAMES.filter(g=>g!=='build'||buildable(L0).length);[gs[n%gs.length],gs[(n+1)%gs.length]].forEach(g=>steps.push({type:g,g:'놀이'}))}
if(st<=4){const tr=traceItems(L0,st);if(tr.length)steps.push({type:'trace',g:'쓰기',items:tr})}
else steps.push({type:'dict',g:'받아쓰기',items:shuffle(L0.items).slice(0,3)});
steps.push({type:'speak',g:'소리 내 읽기',items:shuffle(L0.items).slice(0,isSent(L0.items[0])?1:2)})}
steps.push({type:'stamp',g:'도장'});return steps}

let L=null;
function startLesson(id,o){o=o||{};leave();const k=kid(id);if(!k)return;const P=prog(id);const nn=nextLesson(k),n=o.n||nn;curKid=id;
const practice=!!o.practice||n!==nn||todayCount(P)>=(k.double?2:1);
L={kid:id,n,practice,steps:buildSteps(n,P,practice),i:0,sub:0,qs:0,qt:0,lock:false,combo:0};view='lesson';
app.innerHTML=`<div class="screen" id="lesson"><div class="lbar"><button class="ibtn" id="homeBtn" aria-label="처음으로">${IC.home}</button><div class="path"><div class="track" id="dots"></div></div><div class="who"><span>${k.animal}</span>${esc(k.name)}</div></div><div class="stage" id="stage"></div></div>`;
$('#homeBtn').onclick=()=>goHome(id);renderStep()}
function renderDots(){const gs=[...new Set(L.steps.map(s=>s.g))];const cur=L.steps[L.i].g;const ci=gs.indexOf(cur);
const k=kid(L.kid),f=gs.length>1?ci/(gs.length-1):0;const chk='<svg class="i" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>';
$('#dots').innerHTML=gs.map((g,i)=>`<div class="stone ${i===ci?'on':i<ci?'ok':''}"><i>${i<ci?chk:''}</i><b>${g}</b></div>`).join('')+`<span class="walker" id="walker" style="left:calc(1.2rem + (100% - 2.4rem) * ${L.wf||0})">${k.animal}</span>`;
requestAnimationFrame(()=>requestAnimationFrame(()=>{const w=$('#walker');if(w)w.style.left=`calc(1.2rem + (100% - 2.4rem) * ${f})`;L.wf=f}))}
function renderStep(){if(cleanup){try{cleanup()}catch(e){}cleanup=null}L.sub=0;L.lock=false;L.phase=0;renderDots();const s=L.steps[L.i];({review:rQuiz,quiz:rQuiz,learn:rLearn,trace:rTrace,dict:rDict,story:rStory,speak:rSpeak,stamp:rStamp,balloon:rBalloon,mole:rMole,match:rMatch,build:rBuild})[s.type]()}
function nextStep(){stopAudio();L.i++;if(L.i>=L.steps.length)return goHome(L.kid);renderStep()}
const stage=()=>$('#stage');
const gcls=t=>isSent(t)&&t.length>5?'g4':t.length===1?'g1':t.length<=3?'g2':t.length<=6?'g3':'g4';
const title=()=>`<div class="lt">${L.n}회차 · ${esc(LESSONS[L.n-1].t)}</div>`;

function rLearn(){const s=L.steps[L.i],t=s.items[L.sub];
stage().innerHTML=`${title()}<button class="bigcard ${EMO[t]?'col':''}" id="card">${EMO[t]?`<span class="lemo pop">${EMO[t]}</span>`:''}<span class="${gcls(t)} pop" ${EMO[t]&&t.length<=3?'style="font-size:min(14vh,6rem)"':''}>${esc(t)}</span><span class="spk">${IC.spk}</span></button>
<div class="row"><span class="cnt">${L.sub+1} / ${s.items.length}</span><button class="btn primary" id="nx">다음</button></div>`;
$('#card').onclick=()=>speak(t);$('#nx').onclick=()=>{L.sub++;L.sub<s.items.length?rLearn():nextStep()};setTimeout(()=>speak(t),250)}

function rQuiz(){const s=L.steps[L.i],q=s.qs[L.sub];const col=isSent(q.o[0])||q.o.some(o=>o.length>6);
stage().innerHTML=`${s.type==='review'?'<div class="lt">지난번에 헷갈렸던 글자예요</div>':title()}
<div class="qhead"><button class="speaker" id="sp" aria-label="다시 듣기">${IC.spk}</button><p class="hint">잘 듣고 맞는 것을 골라요</p></div>
<div class="opts ${col?'col':''}">${q.o.map(o=>`<button class="opt" data-t="${esc(o)}"><span class="${col?'g4':gcls(o)}" ${col?'':'style="font-size:min(13vh,'+(o.length<=1?'7':o.length<=3?'5':'3.4')+'rem)"'}>${esc(o)}</span></button>`).join('')}</div>
<div class="cnt">${L.sub+1} / ${s.qs.length}</div>`;
$('#sp').onclick=()=>speak(q.t);
stage().querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b,q,s));setTimeout(()=>speak(q.t),300)}
function pick(b,q,s){if(L.lock)return;L.lock=true;const ok=b.dataset.t===q.t;const P=prog(L.kid);
if(ok){b.classList.add('ok');sfx.good();L.combo=(L.combo||0)+1;goodFx(b,L.combo)}else{L.combo=0;b.classList.add('no');sfx.bad();cheer(false,'괜찮아요, 다시 봐요');stage().querySelectorAll('.opt').forEach(x=>{if(x.dataset.t===q.t)x.classList.add('ok')})}
if(s.type==='review'){const r=P.review[q.t];if(r){if(ok){r.streak++;if(r.streak>=3)delete P.review[q.t];else r.due=P.sessions+[1,2,4][r.streak]}else{r.streak=0;r.due=P.sessions+1}}}
else{L.qt++;if(ok)L.qs++;else P.review[q.t]={due:P.sessions+1,streak:0,n:L.n}}
save();setTimeout(()=>{L.lock=false;L.sub++;L.sub<s.qs.length?rQuiz():nextStep()},ok?800:1600)}


function addWrong(t){const P=prog(L.kid);if(!L.practice)P.review[t]={due:P.sessions+1,streak:0,n:L.n};save()}
function rBalloon(){const s=L.steps[L.i];if(!s.rounds){const it=shuffle(LESSONS[L.n-1].items.filter(x=>!isSent(x)));s.rounds=Array.from({length:4},(_,i)=>{const t=it[i%it.length];return{t,o:shuffle([t,...distract(t,L.n,3)])}})}
const r=s.rounds[L.sub];let miss=false,lock=false;
stage().innerHTML=`<div class="ghead"><button class="speaker sm" id="sp" aria-label="다시 듣기">${IC.spk}</button><p class="hint">들리는 글자 풍선을 터뜨려요</p><span class="cnt">${L.sub+1} / ${s.rounds.length}</span></div><div class="sky" id="sky">${r.o.map((o,i)=>`<button class="balloon b${i}" data-t="${esc(o)}" style="left:${13+i*24.5}%;--d:${8+((i*37+L.sub*11)%5)}s;animation-delay:-${((i*2.3+L.sub*1.1)%5).toFixed(1)}s"><span class="${o.length>2?'bs':''}">${esc(o)}</span></button>`).join('')}</div>`;
const sky=$('#sky');sky.style.setProperty('--h',-(sky.clientHeight+12*parseFloat(getComputedStyle(document.documentElement).fontSize))+'px');
$('#sp').onclick=()=>speak(r.t);setTimeout(()=>speak(r.t),300);
sky.querySelectorAll('.balloon').forEach(b=>b.onclick=()=>{if(lock)return;if(b.dataset.t===r.t){lock=true;const tr=getComputedStyle(b).transform;b.style.animation='none';b.style.transform=tr;b.style.transition='transform .3s,opacity .3s';requestAnimationFrame(()=>{b.style.transform=tr+' scale(1.6)';b.style.opacity=0});
sfx.good();L.combo++;goodFx(b,L.combo);L.qt++;if(!miss)L.qs++;setTimeout(()=>{L.sub++;L.sub<s.rounds.length?rBalloon():nextStep()},900)}
else{b.classList.remove('wob');void b.offsetWidth;b.classList.add('wob');sfx.bad();if(!miss){miss=true;L.combo=0;addWrong(r.t);cheer(false,'다시 잘 들어 봐요');setTimeout(()=>speak(r.t),500)}}})}

function rMole(){const s=L.steps[L.i],items=LESSONS[L.n-1].items.filter(x=>!isSent(x)&&x.length<=3);if(!s.t)s.t=shuffle(items.length?items:LESSONS[L.n-1].items)[0];const t=s.t,ds=distract(t,L.n,3);
let hits=0,over=false;const end=Date.now()+30000;
stage().innerHTML=`<div class="ghead"><button class="speaker sm" id="sp" aria-label="다시 듣기">${IC.spk}</button><p class="hint">이 글자 두더지를 잡아요</p><span class="mtarget">${esc(t)}</span><span class="hits" id="hits">${'<i></i>'.repeat(4)}</span></div>
<div class="holes">${Array.from({length:6},(_,i)=>`<div class="hole"><button class="mole" data-h="${i}"><span class="mface"><i></i><i></i></span><b></b></button></div>`).join('')}</div>`;
const moles=[...stage().querySelectorAll('.mole')];let last=-1,tc=0;
const pop=()=>{const free=moles.filter(m=>!m.classList.contains('up'));if(!free.length)return;let m=free[Math.random()*free.length|0];if(free.length>1&&moles.indexOf(m)===last)m=free.find(x=>moles.indexOf(x)!==last);last=moles.indexOf(m);
const isT=tc>=1||Math.random()<.5;tc=isT?0:tc+1;m.dataset.t=isT?t:ds[Math.random()*ds.length|0];m.querySelector('b').textContent=m.dataset.t;m.classList.remove('hit');m.classList.add('up');clearTimeout(m._t);m._t=setTimeout(()=>m.classList.remove('up'),1800)};
const fin=()=>{if(over)return;over=true;clearInterval(iv);setTimeout(()=>{if(L&&L.steps[L.i]===s)nextStep()},800)};
const iv=setInterval(()=>{pop();if(Date.now()>end)fin()},950);pop();cleanup=()=>{clearInterval(iv);moles.forEach(m=>clearTimeout(m._t))};
$('#sp').onclick=()=>speak(t);setTimeout(()=>speak(t),300);
moles.forEach(m=>m.onclick=()=>{if(over||!m.classList.contains('up')||m.classList.contains('hit'))return;
if(m.dataset.t===t){hits++;m.classList.add('hit');sfx.good();const [x,y]=centerOf(m);confetti(x,y,14);cheer(true,hits>=4?'다 잡았어요!':hits+'마리 잡았어요!');$('#hits').innerHTML=Array.from({length:4},(_,i)=>`<i class="${i<hits?'f':''}"></i>`).join('');clearTimeout(m._t);m._t=setTimeout(()=>m.classList.remove('up'),380);if(hits>=4)fin()}
else{sfx.bad();m.classList.remove('wob');void m.offsetWidth;m.classList.add('wob')}})}

function rMatch(){const s=L.steps[L.i];
if(!s.cards){const words=shuffle(LESSONS[L.n-1].items.filter(x=>!isSent(x)&&x.length<=4)),pic=words.filter(w=>EMO[w]);let pairs;
if(pic.length>=3)pairs=pic.slice(0,4).map(w=>[{k:w,f:w},{k:w,f:EMO[w],pic:1}]);
else{const ws=words.slice(0,stageOf(L.n)===1?3:4);if(ws.length<3)ws.push(...distract(ws[0]||'아',L.n,3-ws.length));pairs=ws.map(w=>[{k:w,f:w},{k:w,f:w}])}

let open=[],done=0,lock=false;
stage().innerHTML=`<p class="hint">${s.cards.some(c=>c.pic)?'카드를 뒤집어 글자와 그림 짝을 찾아요':'카드를 뒤집어 같은 글자 짝을 찾아요'}</p><div class="mgrid c${s.cards.length}">${s.cards.map(c=>`<button class="mcard" data-i="${c.id}"><span class="back wood">${BOOK}</span><span class="front ${c.pic?'pic':''}">${esc(c.f)}</span></button>`).join('')}</div>`;
stage().querySelectorAll('.mcard').forEach(b=>b.onclick=()=>{const c=s.cards[+b.dataset.i];if(lock||b.classList.contains('f'))return;b.classList.add('f');speak(c.k);open.push([b,c]);
if(open.length<2)return;lock=true;const [[b1,c1],[b2,c2]]=open;open=[];
if(c1.k===c2.k){setTimeout(()=>{b1.classList.add('ok');b2.classList.add('ok');sfx.good();L.combo++;goodFx(b2,L.combo);done+=2;lock=false;if(done===s.cards.length)setTimeout(nextStep,1100)},450)}
else setTimeout(()=>{b1.classList.remove('f');b2.classList.remove('f');lock=false},1100)})}

function rBuild(){const s=L.steps[L.i];if(!s.rounds)s.rounds=shuffle(buildable(LESSONS[L.n-1])).slice(0,2);
const t=s.rounds[L.sub],parts=[...t].map(decomp),need=[];
parts.forEach((p,si)=>{need.push({k:'c',x:CHO[p.c],si});need.push({k:'v',x:JUNG[p.v],si});if(p.j)need.push({k:'j',x:JONG[p.j],si})});
const uniq=[...new Set(need.map(n=>n.x))],dc=shuffle([...'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅎ'].filter(x=>!uniq.includes(x))).slice(0,2),dv=shuffle([...'ㅏㅓㅗㅜㅡㅣ'].filter(x=>!uniq.includes(x))).slice(0,1);
const blocks=shuffle([...uniq,...dc,...dv]);let pos=0,miss=0,fin=false;
const glyph=si=>{const f=need.filter((n,i)=>n.si===si&&i<pos),p=parts[si];if(!f.length)return '';if(f.length===1)return CHO[p.c];return compose(p.c,p.v,f.length===3?p.j:0)};
const draw=()=>{stage().innerHTML=`<div class="ghead"><button class="speaker sm" id="sp" aria-label="다시 듣기">${IC.spk}</button><p class="hint">소리를 듣고 블록으로 글자를 만들어요</p><span class="cnt">${L.sub+1} / ${s.rounds.length}</span></div>
<div class="bwrap">${parts.map((p,si)=>`<div class="syl"><div class="sylg ${fin?'done':''}"><span class="${glyph(si)?'pop':''}">${glyph(si)}</span></div><div class="spills">${need.map((n,i)=>n.si===si?`<i class="${n.k} ${i<pos?'f':''} ${i===pos&&!fin?'nx':''}">${i<pos?n.x:''}</i>`:'').join('')}</div></div>`).join('')}</div>
<div class="blocks">${blocks.map(b=>`<button class="jm blk ${isVowel(b)?'v':'c'} ${miss>=2&&!fin&&need[pos]&&need[pos].x===b?'hintme':''}" data-b="${b}">${b}</button>`).join('')}</div>`;
$('#sp').onclick=()=>speak(t);
stage().querySelectorAll('[data-b]').forEach(el=>el.onclick=()=>{if(fin)return;if(el.dataset.b===need[pos].x){pos++;tone(880,.08);if(pos===need.length){fin=true;draw();const g=stage().querySelector('.bwrap');sfx.good();L.combo++;goodFx(g,L.combo);speak(t);L.qt++;if(!miss)L.qs++;setTimeout(()=>{L.sub++;L.sub<s.rounds.length?rBuild():nextStep()},1500)}else draw()}
else{sfx.bad();el.classList.remove('wob');void el.offsetWidth;el.style.animation='shake .4s';setTimeout(()=>el.style.animation='',420);miss++;if(miss===1){L.combo=0;addWrong(t)}if(miss===2)draw()}})};
draw();setTimeout(()=>speak(t),300)}

function rTrace(){const s=L.steps[L.i],t=s.items[L.sub];L.tries=0;
stage().innerHTML=`${title()}<p class="hint">흐린 글자 위를 손가락으로 따라 써요</p>
<div class="tbox" id="tb"><canvas id="c0"></canvas><canvas id="c1"></canvas></div><div class="msg" id="msg"></div>
<div class="row"><button class="btn" id="tl">${IC.spk}소리 듣기</button><button class="btn" id="tc">지우기</button><button class="btn primary" id="td">다 썼어요</button></div>`;
const tb=$('#tb'),c0=$('#c0'),c1=$('#c1');const W=tb.clientWidth,H=tb.clientHeight,dpr=window.devicePixelRatio||1;
[c0,c1].forEach(c=>{c.width=W*dpr;c.height=H*dpr});const x0=c0.getContext('2d'),x1=c1.getContext('2d');x0.scale(dpr,dpr);x1.scale(dpr,dpr);
const N=t.length,box=Math.min(H*.86,W*.92/N),sx=(W-N*box)/2,sy=(H-box)/2,fs=box*.8;
const font=`500 ${fs}px 'Noto Sans KR'`;
const drawBg=()=>{x0.clearRect(0,0,W,H);x0.strokeStyle='#E6D6C1';x0.lineWidth=2;for(let i=0;i<N;i++){x0.setLineDash([]);x0.strokeRect(sx+i*box,sy,box,box);x0.setLineDash([8,8]);x0.beginPath();x0.moveTo(sx+i*box+box/2,sy);x0.lineTo(sx+i*box+box/2,sy+box);x0.moveTo(sx+i*box,sy+box/2);x0.lineTo(sx+i*box+box,sy+box/2);x0.stroke()}x0.setLineDash([]);
x0.font=font;x0.textAlign='center';x0.textBaseline='middle';x0.fillStyle='#E9DCCB';for(let i=0;i<N;i++)x0.fillText(t[i],sx+i*box+box/2,sy+box/2+fs*.04)};
(document.fonts&&document.fonts.load?document.fonts.load(font,t):Promise.resolve()).then(drawBg,drawBg);drawBg();
x1.lineCap='round';x1.lineJoin='round';x1.strokeStyle='#E9557F';x1.lineWidth=Math.max(10,fs*.085);
let drawing=false,last=null;const pos=e=>{const r=c1.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
c1.onpointerdown=e=>{drawing=true;last=pos(e);c1.setPointerCapture(e.pointerId);x1.beginPath();x1.arc(last[0],last[1],x1.lineWidth/2,0,7);x1.fillStyle='#E9557F';x1.fill()};
c1.onpointermove=e=>{if(!drawing)return;const p=pos(e);x1.beginPath();x1.moveTo(last[0],last[1]);x1.lineTo(p[0],p[1]);x1.stroke();last=p};
c1.onpointerup=c1.onpointercancel=()=>{drawing=false};
$('#tl').onclick=()=>speak(t);$('#tc').onclick=()=>{x1.clearRect(0,0,W,H);$('#msg').textContent=''};
$('#td').onclick=()=>{const m=document.createElement('canvas');m.width=W;m.height=H;const mx=m.getContext('2d');mx.font=font;mx.textAlign='center';mx.textBaseline='middle';mx.fillStyle='#000';for(let i=0;i<N;i++)mx.fillText(t[i],sx+i*box+box/2,sy+box/2+fs*.04);
const u=document.createElement('canvas');u.width=W;u.height=H;const ux=u.getContext('2d');ux.drawImage(c1,0,0,W,H);
const md=mx.getImageData(0,0,W,H).data,ud=ux.getImageData(0,0,W,H).data;let g=0,cov=0,ink=0;
for(let y=0;y<H;y+=3)for(let x=0;x<W;x+=3){const k=(y*W+x)*4+3;const gm=md[k]>100,um=ud[k]>40;if(gm){g++;if(um)cov++}if(um)ink++}
const r=g?cov/g:0;const msy=ink>g*3.2;L.tries++;const msg=$('#msg');
if((r>=.42&&!msy)||L.tries>=3){msg.className='msg good';msg.textContent='참 잘 썼어요!';sfx.good();goodFx(tb,0);setTimeout(()=>{L.sub++;L.sub<s.items.length?rTrace():nextStep()},1100)}
else{msg.className='msg again';msg.textContent=msy?'흐린 글자 위에만 써 볼까요?':'조금 더 따라 써 볼까요?';sfx.bad();x1.clearRect(0,0,W,H)}};
setTimeout(()=>speak(t),300)}

function rSpeak(){const s=L.steps[L.i],t=s.items[L.sub];let blob=null;
stage().innerHTML=`${title()}<p class="hint">소리 내어 읽고 녹음해요</p><div class="bigcard" style="height:36vh"><span class="${t.length>8?'g4':gcls(t)}">${esc(t)}</span></div>
<div class="speakrow"><button class="btn teal" id="sl">${IC.spk}선생님 소리</button><button class="recb" id="rb" aria-label="녹음">${IC.mic}</button><button class="btn" id="sm" disabled>${IC.play}내 목소리</button></div>
<div class="row"><span class="msg" id="msg"></span><button class="btn primary" id="sn" ${canRec()?'disabled':''}>${canRec()?'다음':'다 읽었어요'}</button></div>`;
const rb=$('#rb');if(!canRec()){rb.style.display='none';$('#sm').style.display='none'}
$('#sl').onclick=()=>speak(t);
rb.onclick=async()=>{if(MR){recStop();return}stopAudio();try{await recStart(async b=>{rb.classList.remove('on');rb.innerHTML=IC.mic;blob=b;$('#sm').disabled=false;$('#sn').disabled=false;const m=$('#msg');m.className='msg good';m.textContent='잘 읽었어요!';sfx.good();goodFx(rb,0);
const P=prog(L.kid),key='r|'+L.kid+'|'+Date.now();if(await DB.put(key,b)){P.recs.unshift({key,n:L.n,t,d:today()});while(P.recs.length>30){const o=P.recs.pop();DB.del(o.key)}save()}});
rb.classList.add('on');rb.innerHTML=IC.stop;const m=$('#msg');m.className='msg';m.textContent='읽고 나서 네모를 눌러요'}catch(e){rb.style.display='none';$('#sm').style.display='none';$('#sn').disabled=false;$('#sn').textContent='다 읽었어요'}};
$('#sm').onclick=()=>playBlob(blob);
$('#sn').onclick=()=>{recStop();L.sub++;L.sub<s.items.length?rSpeak():nextStep()}}

function rStamp(){const k=kid(L.kid),P=prog(L.kid),n=L.n;
const pass=L.qt?L.qs>=Math.ceil(L.qt*.75):true;
if(L.practice){stage().innerHTML=`<div class="stamp" style="border-color:var(--teal);color:var(--teal)"><b>연습 끝!</b><span>하하!</span></div><div class="stampsum">연습은 도장 없이 마음껏 할 수 있어요</div><div class="row"><button class="btn primary" id="sh">내 홈으로</button></div>`;sfx.stamp();confetti(0,0,30,true);$('#sh').onclick=()=>goHome(L.kid);return}
if(!L.saved){L.saved=1;P.log.unshift({d:today(),n,score:L.qs,total:L.qt,pass});P.log=P.log.slice(0,300);P.sessions++;P.stamps++;
if(pass){if(CHECKS.includes(n)){k.pending=n}else if(k.queue[0]===n){k.queue.shift()}else if(k.current===n&&n<120){k.current++}}
if(P.stamps%10===0){const Z=zoo(k),lk=ANIMALS.filter(a=>!Z.includes(a));if(lk.length){L.friend=lk[Math.random()*lk.length|0];Z.push(L.friend)}}save()}
const more=k.double&&todayCount(P)<2;
stage().innerHTML=`<div class="stamp"><b>${pass?'참 잘했어요':'잘했어요'}</b><span>하하!</span></div>
<div class="board">${Array.from({length:10},(_,i)=>{const fill=((P.stamps-1)%10)+1;return `<i class="${i<fill?'f':''} ${i===fill-1?'new':''}">하</i>`}).join('')}</div>
<div class="stampsum">${P.stamps%10===0?(L.friend?'도장판을 다 채웠어요! 새 친구 '+L.friend+' 가 왔어요':'도장판을 다 채웠어요!'):(pass?'':'다음에 한 번 더 해 봐요 · ')+'모은 도장 '+P.stamps+'개'}</div>
<div class="row"><button class="btn" id="sx">다음 친구</button>${more?'<button class="btn" id="sh">내 홈으로</button><button class="btn primary" id="sa">한 번 더 공부하기</button>':'<button class="btn primary" id="sh">내 홈으로</button>'}</div>`;
sfx.stamp();confetti(0,0,46,true);setTimeout(()=>tts(pass?'참 잘했어요. 하하!':'잘했어요. 다음에 또 해요.'),600);
$('#sx').onclick=goSelect;$('#sh').onclick=()=>goHome(L.kid);if(more)$('#sa').onclick=()=>startLesson(L.kid)}

/* 관리자 */
let aTab='kids',aKid=null,aVoiceN=1;
function goAdmin(tab){leave();view='admin';document.body.classList.add('admin');aTab=tab||aTab;if(!aKid||!kid(aKid))aKid=S.kids[0]&&S.kids[0].id;
const nv=[['kids','아이 관리',IC.kids],['prog','학습 현황',IC.chart],['voice','소리 녹음',IC.wave],['set','설정',IC.gear]];
app.innerHTML=`<div class="screen" id="admin"><nav class="anav">${miniLogo}${nv.map(([k,t,i])=>`<button class="nv ${aTab===k?'on':''}" data-t="${k}">${i}${t}</button>`).join('')}<div class="grow"></div><button class="nv" id="exitA">${IC.out}학습 화면으로</button></nav><main class="amain" id="am"></main></div>`;
app.querySelectorAll('.nv[data-t]').forEach(b=>b.onclick=()=>goAdmin(b.dataset.t));$('#exitA').onclick=()=>{goFull();goSelect()};
({kids:aKids,prog:aProg,voice:aVoice,set:aSet})[aTab]()}
const lessonOpts=sel=>LESSONS.map(l=>`<option value="${l.n}" ${l.n===sel?'selected':''}>${l.n}회차 · ${esc(l.t)}</option>`).join('');

function aKids(){const am=$('#am');
am.innerHTML=`<div class="ahead"><h2>아이 관리 <span class="muted" style="font-size:1rem">${S.kids.length}명</span></h2><button class="btn primary sm" id="add">아이 추가</button></div>
<div class="card"><table class="tbl"><thead><tr><th></th><th>이름</th><th>반</th><th>진도</th><th>도장</th><th></th></tr></thead><tbody>
${S.classes.map((c,ci)=>S.kids.filter(k=>k.cls===ci).map(k=>{const P=prog(k.id);return `<tr><td style="font-size:1.8rem;width:3rem">${k.animal}</td><td class="nw"><b>${esc(k.name)}</b></td><td class="nw">${esc(c)}</td><td class="nw">${nextLesson(k)}회차${k.pending?' <span class="tag y">승인 대기</span>':''}</td><td class="nw">${P.stamps}개</td>
<td><div class="acts"><button class="btn sm" data-e="${k.id}">수정</button><button class="btn sm" data-p="${k.id}">학습 현황</button></div></td></tr>`}).join('')).join('')}
</tbody></table>${S.kids.length?'':'<p class="note" style="padding:1rem 0">아직 등록된 아이가 없어요. 오른쪽 위 \'아이 추가\'를 눌러 주세요.</p>'}</div>
<p class="note">처음 들어 있는 새싹이·튼튼이·씩씩이·똑똑이는 시험용 예시예요. 수정에서 실제 이름으로 바꾸거나 지워 주세요.</p>`;
$('#add').onclick=()=>kidForm(null);am.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>kidForm(b.dataset.e));am.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{aKid=b.dataset.p;goAdmin('prog')})}

function kidForm(id){const k=id?kid(id):{name:'',cls:curCls,animal:ANIMALS[S.kids.length%ANIMALS.length],current:1};let f={...k};
const m=document.createElement('div');m.className='modal';
const draw=()=>{m.innerHTML=`<div class="mbox"><h3>${id?'아이 정보 수정':'아이 등록'}</h3>
<div class="fl"><label>이름</label><input id="fn" value="${esc(f.name)}" maxlength="10" placeholder="실명을 써 주세요" style="flex:1"></div>
<div class="fl"><label>반</label><div class="seg">${S.classes.map((c,i)=>`<button data-c="${i}" class="${f.cls===i?'on':''}">${esc(c)}</button>`).join('')}</div></div>
${id?'':`<div class="fl"><label>시작 회차</label><select id="fs">${lessonOpts(f.current)}</select></div>`}
<div class="fl" style="align-items:flex-start"><label>동물</label><div class="anis" style="flex:1">${ANIMALS.map(a=>`<button data-a="${a}" class="${f.animal===a?'on':''}">${a}</button>`).join('')}</div></div>
<div class="row" style="justify-content:space-between;margin-top:1rem">${id?'<button class="btn sm" id="fd" style="color:var(--red)">삭제</button>':'<span></span>'}<div class="row"><button class="btn sm" id="fc">취소</button><button class="btn primary sm" id="fo">저장</button></div></div></div>`;
const keep=()=>{f.name=$('#fn').value;const fs=$('#fs');if(fs)f.current=+fs.value};
m.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{keep();f.cls=+b.dataset.c;draw()});m.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{keep();f.animal=b.dataset.a;draw()});
$('#fc').onclick=()=>m.remove();
$('#fo').onclick=()=>{keep();f.name=f.name.trim();if(!f.name){$('#fn').focus();return toast('이름을 써 주세요')}
if(id)Object.assign(k,{name:f.name,cls:f.cls,animal:f.animal});else S.kids.push({id:uid(),name:f.name,cls:f.cls,animal:f.animal,current:f.current,queue:[],double:false});save();m.remove();goAdmin('kids')};
const fd=$('#fd');if(fd)fd.onclick=()=>{if(fd.dataset.sure){S.kids=S.kids.filter(x=>x.id!==id);delete S.prog[id];save();m.remove();goAdmin('kids')}else{fd.dataset.sure=1;fd.textContent='한 번 더 누르면 삭제'}}};
document.body.appendChild(m);draw()}

function aProg(){const am=$('#am');if(!S.kids.length){am.innerHTML='<div class="ahead"><h2>학습 현황</h2></div><p class="note">먼저 아이를 등록해 주세요.</p>';return}
const k=kid(aKid),P=prog(k.id);
const wrong=Object.entries(P.review).sort((a,b)=>a[1].due-b[1].due);
const dq=P.dict.filter(d=>d.correct===null);
am.innerHTML=`<div class="ahead"><h2>학습 현황</h2></div><div class="split">
<div class="klist">${S.classes.map((c,ci)=>{const ks=S.kids.filter(x=>x.cls===ci);return ks.length?`<div class="grp">${esc(c)}</div>`+ks.map(x=>`<button data-k="${x.id}" class="${x.id===k.id?'on':''}"><span>${x.animal}</span>${esc(x.name)}<em>${nextLesson(x)}</em></button>`).join(''):''}).join('')}</div>
<div>
<div class="card"><h3>${k.animal} ${esc(k.name)} · ${esc(S.classes[k.cls])}</h3>
${k.pending?`<div class="fl"><span class="tag y">${k.pending}회차 단계 확인 통과</span><span class="muted">녹음을 듣고 승인하면 다음 단계로 넘어가요</span><button class="btn teal sm" id="ap">승인하기</button></div>`:''}
<div class="fl"><label>지금 진도</label><select id="cur">${lessonOpts(k.current)}</select></div>
<div class="fl"><label>먼저 할 회차</label><select id="qadd"><option value="">회차를 골라 추가해요</option>${lessonOpts(0)}</select></div>
<div class="fl"><label></label><div class="chips">${k.queue.length?k.queue.map((n,i)=>`<span class="chipq">${n}회 ${esc(LESSONS[n-1].t)}<button data-q="${i}" aria-label="빼기">${IC.x}</button></span>`).join(''):'<span class="muted">비어 있으면 지금 진도대로 해요</span>'}</div></div>
<div class="fl"><label>한 번에 2회차</label><button class="toggle ${k.double?'on':''}" id="dbl" aria-label="2회차 연속"></button><span class="muted">켜면 10분 학습 뒤 한 번 더 할 수 있어요</span></div></div>
${dq.length?`<div class="card"><h3>받아쓰기 점수 입력</h3><table class="tbl"><tbody>${dq.map(d=>`<tr><td class="nw">${d.d.slice(5)}</td><td class="nw">${d.n}회차</td><td>${d.items.map(esc).join(' · ')}</td><td><div class="acts">${d.items.map((_,i)=>i).concat(d.items.length).map(c=>`<button class="btn sm" data-d="${d.id}" data-c="${c}">${c}개</button>`).join('')}</div></td></tr>`).join('')}</tbody></table></div>`:''}
<div class="card"><h3>다시 볼 글자 <span class="muted" style="font-weight:500">${wrong.length}개</span></h3>${wrong.length?`<div class="chips">${wrong.map(([t,r])=>`<span class="tag p" style="font-size:1rem">${esc(t)} · ${r.streak}/3</span>`).join('')}</div>`:'<p class="note">틀린 글자가 없어요</p>'}</div>
<div class="card"><h3>녹음 듣기</h3>${P.recs.length?`<table class="tbl"><tbody>${P.recs.slice(0,10).map((r,i)=>`<tr><td class="nw">${r.d.slice(5)}</td><td class="nw">${r.n}회차</td><td>${esc(r.t)}</td><td><div class="acts"><button class="btn sm teal" data-r="${i}">${IC.play}듣기</button></div></td></tr>`).join('')}</tbody></table>`:'<p class="note">아직 녹음이 없어요</p>'}</div>
<div class="card"><h3>최근 학습</h3>${P.log.length?`<table class="tbl"><thead><tr><th>날짜</th><th>회차</th><th>점수</th><th>결과</th></tr></thead><tbody>${P.log.slice(0,12).map(l=>`<tr><td class="nw">${l.d.slice(5)}</td><td>${l.n}회차 · ${esc(LESSONS[l.n-1].t)}</td><td class="nw">${l.total?l.score+' / '+l.total:'-'}</td><td class="nw">${l.pass?'<span class="tag g">통과</span>':'<span class="tag p">다시</span>'}</td></tr>`).join('')}</tbody></table>`:'<p class="note">아직 학습 기록이 없어요</p>'}</div>
${P.dict.some(d=>d.correct!==null)?`<div class="card"><h3>받아쓰기 기록</h3><table class="tbl"><tbody>${P.dict.filter(d=>d.correct!==null).slice(0,8).map(d=>`<tr><td class="nw">${d.d.slice(5)}</td><td class="nw">${d.n}회차</td><td>${d.items.map(esc).join(' · ')}</td><td class="nw"><b>${d.correct} / ${d.items.length}</b></td></tr>`).join('')}</tbody></table></div>`:''}
</div></div>`;
am.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{aKid=b.dataset.k;aProg()});
$('#cur').onchange=e=>{k.current=+e.target.value;save();toast('진도를 바꿨어요')};
$('#qadd').onchange=e=>{const v=+e.target.value;if(v&&!k.queue.includes(v)){k.queue.push(v);save()}aProg()};
am.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{k.queue.splice(+b.dataset.q,1);save();aProg()});
$('#dbl').onclick=()=>{k.double=!k.double;save();aProg()};
const ap=$('#ap');if(ap)ap.onclick=()=>{if(k.current===k.pending&&k.current<120)k.current++;else if(k.queue[0]===k.pending)k.queue.shift();k.pending=null;save();toast('승인했어요');aProg()};
am.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const d=P.dict.find(x=>x.id===b.dataset.d);if(d){d.correct=+b.dataset.c;save();aProg()}});
am.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>playBlob(await DB.get(P.recs[+b.dataset.r].key)))}

function aVoice(){const am=$('#am'),l=LESSONS[aVoiceN-1];
am.innerHTML=`<div class="ahead"><h2>소리 녹음</h2></div>
<div class="card"><p class="note" style="margin-bottom:1rem">원장님이 녹음한 소리가 있으면 기계 음성 대신 그 소리가 나와요. 자모 하나의 소리처럼 기계 음성이 잘 못 내는 소리부터 녹음해 주세요.</p>
<div class="fl"><label>회차</label><select id="vn">${lessonOpts(aVoiceN)}</select></div></div>
<div class="card"><table class="tbl"><tbody>${l.items.map((t,i)=>{const has=S.voices.includes(t);return `<tr><td style="font-size:1.4rem;font-weight:700">${esc(t)}</td><td class="nw">${has?'<span class="tag g">원장님 목소리</span>':'<span class="tag t">기계 음성</span>'}</td>
<td><div class="acts"><button class="btn sm" data-l="${i}">${IC.spk}듣기</button><button class="btn sm pink" data-v="${i}">${IC.mic}녹음</button>${has?`<button class="btn sm" data-x="${i}">지우기</button>`:''}</div></td></tr>`}).join('')}</tbody></table></div>
${canRec()?'':'<p class="note">이 화면에서는 마이크를 쓸 수 없어요. 태블릿에 설치한 앱에서 녹음해 주세요.</p>'}`;
$('#vn').onchange=e=>{aVoiceN=+e.target.value;aVoice()};
am.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>speak(l.items[+b.dataset.l]));
am.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{const t=l.items[+b.dataset.x];await DB.del('v|'+t);S.voices=S.voices.filter(x=>x!==t);save();aVoice()});
am.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{const t=l.items[+b.dataset.v];if(MR){recStop();return}
try{await recStart(async bl=>{if(await DB.put('v|'+t,bl)){if(!S.voices.includes(t))S.voices.push(t);save();toast('녹음했어요');aVoice()}else toast('저장하지 못했어요')});b.innerHTML=IC.stop+'멈추기';b.classList.remove('pink');b.classList.add('primary')}catch(e){toast('마이크를 쓸 수 없어요')}})}

function aSet(){const am=$('#am');
am.innerHTML=`<div class="ahead"><h2>설정</h2></div>
<div class="card"><h3>원장님 비밀번호</h3><div class="fl"><input id="p1" inputmode="numeric" maxlength="4" placeholder="새 비밀번호 4자리" style="width:14rem"><button class="btn primary sm" id="ps">바꾸기</button><span class="muted">처음 비밀번호는 0000이에요</span></div></div>
<div class="card"><h3>반 이름</h3><div class="fl">${S.classes.map((c,i)=>`<input data-ci="${i}" value="${esc(c)}" maxlength="8" style="width:9rem">`).join('')}<button class="btn primary sm" id="cs">저장</button></div></div>
<div class="card"><h3>태블릿에서 다른 앱으로 못 나가게 하기</h3><p class="note">1. 크롬에서 이 앱을 연 뒤 메뉴(⋮)에서 '홈 화면에 추가'를 눌러 설치해요. 설치한 아이콘으로 열면 주소창 없이 화면 전체로 열려요.<br>2. 태블릿 설정에서 '앱 고정'을 검색해 켜고, '고정 해제 전 PIN 요청'도 켜요.<br>3. 하하 한글을 연 상태에서 최근 앱 버튼을 누르고, 앱 아이콘을 눌러 '이 앱 고정'을 골라요. 이제 PIN 없이는 다른 앱으로 나갈 수 없어요.</p><div class="row" style="justify-content:flex-start;margin-top:.8rem"><button class="btn sm" id="fsb">전체 화면으로 보기</button></div></div>
<div class="card"><h3>기록 백업</h3><p class="note" style="margin-bottom:.8rem">아이 명단과 학습 기록을 파일로 저장하거나 불러와요. 녹음 소리는 파일에 들어가지 않아요.</p><div class="row" style="justify-content:flex-start"><button class="btn sm" id="bx">백업 파일 저장</button><label class="btn sm" style="cursor:pointer">백업 파일 불러오기<input type="file" id="bi" accept=".json" style="display:none"></label><button class="btn sm" id="rs" style="color:var(--red)">모든 기록 지우기</button></div></div>`;
$('#ps').onclick=()=>{const v=$('#p1').value.trim();if(!/^\d{4}$/.test(v))return toast('숫자 4자리로 써 주세요');S.pin=v;save();$('#p1').value='';toast('비밀번호를 바꿨어요')};
$('#cs').onclick=()=>{am.querySelectorAll('[data-ci]').forEach(i=>{const v=i.value.trim();if(v)S.classes[+i.dataset.ci]=v});save();toast('반 이름을 저장했어요');goAdmin('set')};
$('#fsb').onclick=goFull;
$('#bx').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='하하한글-백업-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()};
$('#bi').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);if(!j.kids)throw 0;S=j;save();toast('불러왔어요');goAdmin('set')}catch(x){toast('백업 파일이 아니에요')}})};
const rs=$('#rs');rs.onclick=()=>{if(rs.dataset.sure){S.prog={};S.kids.forEach(k=>{k.queue=[];k.pending=null});save();toast('학습 기록을 지웠어요');goAdmin('set')}else{rs.dataset.sure=1;rs.textContent='한 번 더 누르면 지워져요'}}}

window.__haha={LESSONS,S:()=>S,startLesson,goAdmin,goSelect,goHome,goMap,goPlay,goZoo,L:()=>L};
goIntro();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
